<!-- Thư mục: src/main/resources/templates/content/question-details.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/content-layout :: content-layout(~{::title}, ~{::#content-body})}">
<head>
    <title th:text="${question.id != null ? 'Chỉnh sửa câu hỏi' : 'Thêm câu hỏi mới'}">Chi tiết câu hỏi</title>
</head>
<body>
    <div id="content-body">
        <div style="margin-bottom: 1.5rem;">
            <a th:href="@{/content/questions}" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">← Quay lại ngân hàng câu hỏi</a>
            <h1 style="font-size: 1.75rem; font-weight: 700; margin-top: 0.25rem;"
                th:text="${question.id != null ? 'Chỉnh sửa câu hỏi #' + question.id : 'Thêm câu hỏi mới'}">
                Thêm câu hỏi mới
            </h1>
        </div>

        <!-- Flash messages -->
        <div th:if="${errorMessage}" style="background-color: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; padding: 0.75rem 1rem; border-radius: 0.375rem; margin-bottom: 1.5rem;" th:text="${errorMessage}"></div>

        <div style="background: #ffffff; border-radius: 0.5rem; border: 1px solid var(--border-color); padding: 2rem; max-width: 850px;">
            <form th:action="@{/content/questions/save}" th:object="${question}" method="post">
                <input type="hidden" th:field="*{id}">

                <!-- Môn học & Bài học & Mức độ -->
                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; margin-bottom: 1.25rem;">
                    <div>
                        <label style="display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 0.35rem;">Môn học *</label>
                        <select name="subjectId" id="subjectSelect" required onchange="handleSubjectChange(this.value)" style="width: 100%; padding: 0.6rem; border: 1px solid var(--border-color); border-radius: 0.375rem; background: #ffffff;">
                            <option value="">-- Chọn môn học --</option>
                            <option th:each="s : ${subjects}" th:value="${s.id}" th:text="${s.name}" th:selected="${question.subject != null && question.subject.id == s.id}"></option>
                        </select>
                    </div>

                    <div>
                        <label style="display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 0.35rem;">Bài học liên kết</label>
                        <select name="lessonId" style="width: 100%; padding: 0.6rem; border: 1px solid var(--border-color); border-radius: 0.375rem; background: #ffffff;">
                            <option value="">-- Không gắn cụ thể --</option>
                            <option th:each="l : ${lessons}" th:value="${l.id}" th:text="${l.name}" th:selected="${question.lesson != null && question.lesson.id == l.id}"></option>
                        </select>
                    </div>

                    <div>
                        <label style="display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 0.35rem;">Mức độ câu hỏi *</label>
                        <select name="levelId" required style="width: 100%; padding: 0.6rem; border: 1px solid var(--border-color); border-radius: 0.375rem; background: #ffffff;">
                            <option th:each="lvl : ${levels}" th:value="${lvl.id}" th:text="${lvl.name}" th:selected="${question.level != null && question.level.id == lvl.id}"></option>
                        </select>
                    </div>
                </div>

                <!-- Dimension liên kết (Multi-select) -->
                <div th:if="${not #lists.isEmpty(dimensions)}" style="margin-bottom: 1.25rem;">
                    <label style="display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 0.35rem;">Chuẩn đầu ra (Dimension)</label>
                    <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                        <label th:each="dim : ${dimensions}" style="display: flex; align-items: center; gap: 0.4rem; font-size: 0.9rem; cursor: pointer;">
                            <input type="checkbox" name="dimensionIds" th:value="${dim.id}"
                                   th:checked="${question.dimensions != null && question.dimensions.contains(dim)}">
                            <span th:text="${dim.name}">Tư duy OOP</span>
                        </label>
                    </div>
                </div>

                <!-- Nội dung câu hỏi -->
                <div style="margin-bottom: 1.25rem;">
                    <label style="display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 0.35rem;">Nội dung câu hỏi *</label>
                    <textarea th:field="*{content}" rows="4" required placeholder="Nhập câu hỏi trắc nghiệm tại đây..." style="width: 100%; padding: 0.65rem; border: 1px solid var(--border-color); border-radius: 0.375rem;"></textarea>
                </div>

                <!-- Media đính kèm (URL + Xem trước) -->
                <div style="margin-bottom: 1.5rem; padding: 1rem; background: #f8fafc; border-radius: 0.375rem; border: 1px solid var(--border-color);">
                    <div style="display: grid; grid-template-columns: 150px 1fr; gap: 1rem; align-items: center;">
                        <div>
                            <label style="display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 0.3rem;">Loại Media</label>
                            <select th:field="*{mediaType}" style="width: 100%; padding: 0.55rem; border: 1px solid var(--border-color); border-radius: 0.375rem; background: #ffffff;">
                                <option value="NONE">Không có</option>
                                <option value="IMAGE">Hình ảnh</option>
                                <option value="VIDEO">Video</option>
                                <option value="AUDIO">Âm thanh</option>
                            </select>
                        </div>
                        <div>
                            <label style="display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 0.3rem;">Đường dẫn Media (URL)</label>
                            <input type="url" th:field="*{mediaUrl}" id="mediaUrlInput" placeholder="https://..." oninput="updateMediaPreview(this.value)" style="width: 100%; padding: 0.55rem; border: 1px solid var(--border-color); border-radius: 0.375rem;">
                        </div>
                    </div>
                    <div id="mediaPreview" style="margin-top: 0.75rem;" th:if="${question.mediaUrl != null && !question.mediaUrl.isEmpty()}">
                        <img th:src="${question.mediaUrl}" style="max-height: 180px; border-radius: 0.25rem;">
                    </div>
                </div>

                <!-- ============================================================ -->
                <!-- CÁC PHƯƠNG ÁN ĐÁP ÁN (ANSWER OPTIONS) & CHỌN ĐÁP ÁN ĐÚNG -->
                <!-- ============================================================ -->
                <div style="margin-bottom: 1.5rem;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.75rem;">
                        <label style="font-weight: 700; font-size: 0.95rem;">Các phương án trả lời (Options) *</label>
                        <span style="font-size: 0.85rem; color: var(--text-muted);">Tối thiểu 2 đáp án, tích chọn nút tròn cho 1 đáp án đúng</span>
                    </div>

                    <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                        <!-- Đáp án A -->
                        <div style="display: flex; align-items: center; gap: 0.75rem;">
                            <input type="radio" name="correctIndex" value="0" th:checked="${#lists.size(question.answers) > 0 && question.answers[0].isCorrect}" required style="transform: scale(1.3); cursor: pointer;" title="Chọn làm đáp án đúng">
                            <span style="font-weight: 700; width: 25px;">A.</span>
                            <input type="text" name="optionContent" th:value="${#lists.size(question.answers) > 0 ? question.answers[0].content : ''}" placeholder="Nhập đáp án A..." required style="flex: 1; padding: 0.6rem; border: 1px solid var(--border-color); border-radius: 0.375rem;">
                        </div>

                        <!-- Đáp án B -->
                        <div style="display: flex; align-items: center; gap: 0.75rem;">
                            <input type="radio" name="correctIndex" value="1" th:checked="${#lists.size(question.answers) > 1 && question.answers[1].isCorrect}" style="transform: scale(1.3); cursor: pointer;" title="Chọn làm đáp án đúng">
                            <span style="font-weight: 700; width: 25px;">B.</span>
                            <input type="text" name="optionContent" th:value="${#lists.size(question.answers) > 1 ? question.answers[1].content : ''}" placeholder="Nhập đáp án B..." required style="flex: 1; padding: 0.6rem; border: 1px solid var(--border-color); border-radius: 0.375rem;">
                        </div>

                        <!-- Đáp án C -->
                        <div style="display: flex; align-items: center; gap: 0.75rem;">
                            <input type="radio" name="correctIndex" value="2" th:checked="${#lists.size(question.answers) > 2 && question.answers[2].isCorrect}" style="transform: scale(1.3); cursor: pointer;" title="Chọn làm đáp án đúng">
                            <span style="font-weight: 700; width: 25px;">C.</span>
                            <input type="text" name="optionContent" th:value="${#lists.size(question.answers) > 2 ? question.answers[2].content : ''}" placeholder="Nhập đáp án C (tùy chọn)..." style="flex: 1; padding: 0.6rem; border: 1px solid var(--border-color); border-radius: 0.375rem;">
                        </div>

                        <!-- Đáp án D -->
                        <div style="display: flex; align-items: center; gap: 0.75rem;">
                            <input type="radio" name="correctIndex" value="3" th:checked="${#lists.size(question.answers) > 3 && question.answers[3].isCorrect}" style="transform: scale(1.3); cursor: pointer;" title="Chọn làm đáp án đúng">
                            <span style="font-weight: 700; width: 25px;">D.</span>
                            <input type="text" name="optionContent" th:value="${#lists.size(question.answers) > 3 ? question.answers[3].content : ''}" placeholder="Nhập đáp án D (tùy chọn)..." style="flex: 1; padding: 0.6rem; border: 1px solid var(--border-color); border-radius: 0.375rem;">
                        </div>
                    </div>
                </div>

                <!-- Giải thích chi tiết (Explanation) -->
                <div style="margin-bottom: 1.5rem;">
                    <label style="display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 0.35rem;">Giải thích chi tiết (Hiển thị sau khi nộp bài)</label>
                    <textarea th:field="*{explanation}" rows="3" placeholder="Giải thích lý do vì sao đáp án này đúng..." style="width: 100%; padding: 0.65rem; border: 1px solid var(--border-color); border-radius: 0.375rem;"></textarea>
                </div>

                <!-- Trạng thái -->
                <div style="margin-bottom: 1.5rem;">
                    <label style="display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 0.35rem;">Trạng thái câu hỏi</label>
                    <select th:field="*{status}" style="width: 200px; padding: 0.6rem; border: 1px solid var(--border-color); border-radius: 0.375rem; background: #ffffff;">
                        <option value="ACTIVE">ACTIVE</option>
                        <option value="INACTIVE">INACTIVE</option>
                    </select>
                </div>

                <div style="display: flex; gap: 1rem;">
                    <button type="submit" class="btn btn-primary" style="padding: 0.65rem 1.5rem;">💾 Lưu câu hỏi</button>
                    <a th:href="@{/content/questions}" class="btn btn-outline" style="padding: 0.65rem 1.5rem;">Hủy</a>
                </div>
            </form>
        </div>

        <script>
            function handleSubjectChange(subjectId) {
                if (subjectId) {
                    window.location.href = window.location.pathname + '?subjectId=' + subjectId;
                }
            }
        </script>
    </div>
</body>
</html>
