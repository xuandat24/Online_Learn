<!-- Thư mục: src/main/resources/templates/content/lesson-details.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/content-layout :: content-layout(~{::title}, ~{::#content-body})}">
<head>
    <title th:text="${lesson.id != null ? 'Chỉnh sửa bài học' : 'Thêm bài học mới'}">Chi tiết bài học</title>
</head>
<body>
    <div id="content-body">
        <div style="margin-bottom: 1.5rem;">
            <a th:href="@{'/content/subjects/' + ${subject.id} + '/lessons'}" style="color: var(--text-muted); text-decoration: none; font-size: 0.9rem;">
                ← Quay lại danh sách bài học môn: <span th:text="${subject.name}">Java Core</span>
            </a>
            <h1 style="font-size: 1.75rem; font-weight: 700; margin-top: 0.25rem;"
                th:text="${lesson.id != null ? 'Chỉnh sửa bài học: ' + lesson.name : 'Thêm bài học mới'}">
                Thêm bài học mới
            </h1>
        </div>

        <div style="background: #ffffff; border-radius: 0.5rem; border: 1px solid var(--border-color); padding: 2rem; max-width: 800px;">
            <form th:action="@{/content/lessons/save}" th:object="${lesson}" method="post">
                <input type="hidden" th:field="*{id}">
                <input type="hidden" name="subjectId" th:value="${subject.id}">

                <!-- Phân loại Type (Conditional UI) -->
                <div style="margin-bottom: 1.5rem; padding: 1rem; background: #f8fafc; border-radius: 0.375rem; border: 1px solid var(--border-color);">
                    <label style="display: block; font-weight: 700; margin-bottom: 0.5rem; font-size: 0.95rem;">Phân loại bài học (Lesson Type) *</label>
                    <div style="display: flex; gap: 1.5rem;">
                        <label style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer;">
                            <input type="radio" name="type" value="SUBJECT_TOPIC" th:checked="${lesson.type?.name() == 'SUBJECT_TOPIC'}" onchange="toggleLessonType('SUBJECT_TOPIC')">
                            <strong>📁 Chương mục (Topic)</strong>
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer;">
                            <input type="radio" name="type" value="LESSON" th:checked="${lesson.type == null || lesson.type?.name() == 'LESSON'}" onchange="toggleLessonType('LESSON')">
                            <strong>📄 Bài giảng (Video/HTML)</strong>
                        </label>
                        <label style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer;">
                            <input type="radio" name="type" value="QUIZ" th:checked="${lesson.type?.name() == 'QUIZ'}" onchange="toggleLessonType('QUIZ')">
                            <strong>📝 Bài kiểm tra (Quiz)</strong>
                        </label>
                    </div>
                </div>

                <!-- Tên bài học -->
                <div style="margin-bottom: 1.25rem;">
                    <label style="display: block; font-weight: 600; margin-bottom: 0.35rem; font-size: 0.9rem;">Tên bài học / Tiêu đề chương *</label>
                    <input type="text" th:field="*{name}" required placeholder="VD: Bài 1: Cài đặt môi trường" style="width: 100%; padding: 0.65rem; border: 1px solid var(--border-color); border-radius: 0.375rem;">
                </div>

                <!-- Thứ tự & Chương mục cha & Trạng thái -->
                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1rem; margin-bottom: 1.25rem;">
                    <div>
                        <label style="display: block; font-weight: 600; margin-bottom: 0.35rem; font-size: 0.9rem;">Thứ tự hiển thị *</label>
                        <input type="number" th:field="*{orderNum}" min="1" required style="width: 100%; padding: 0.65rem; border: 1px solid var(--border-color); border-radius: 0.375rem;">
                    </div>

                    <div>
                        <label style="display: block; font-weight: 600; margin-bottom: 0.35rem; font-size: 0.9rem;">Chương mục cha (Parent Topic)</label>
                        <select name="parentId" style="width: 100%; padding: 0.65rem; border: 1px solid var(--border-color); border-radius: 0.375rem; background: #ffffff;">
                            <option value="">-- Không có (Chương gốc) --</option>
                            <option th:each="pt : ${parentTopics}" th:value="${pt.id}" th:text="${pt.name}" th:selected="${lesson.parentLesson != null && lesson.parentLesson.id == pt.id}"></option>
                        </select>
                    </div>

                    <div>
                        <label style="display: block; font-weight: 600; margin-bottom: 0.35rem; font-size: 0.9rem;">Trạng thái</label>
                        <select th:field="*{status}" style="width: 100%; padding: 0.65rem; border: 1px solid var(--border-color); border-radius: 0.375rem; background: #ffffff;">
                            <option value="ACTIVE">ACTIVE</option>
                            <option value="INACTIVE">INACTIVE</option>
                        </select>
                    </div>
                </div>

                <!-- KHU VỰC CONDITIONAL 1: DÀNH CHO BÀI HỌC (LESSON) -->
                <div id="section-lesson" style="margin-bottom: 1.25rem;">
                    <div style="margin-bottom: 1.25rem;">
                        <label style="display: block; font-weight: 600; margin-bottom: 0.35rem; font-size: 0.9rem;">Link Video bài giảng (YouTube/Vimeo)</label>
                        <input type="url" th:field="*{videoLink}" placeholder="https://www.youtube.com/watch?v=..." style="width: 100%; padding: 0.65rem; border: 1px solid var(--border-color); border-radius: 0.375rem;">
                    </div>

                    <div style="margin-bottom: 1.25rem;">
                        <label style="display: block; font-weight: 600; margin-bottom: 0.35rem; font-size: 0.9rem;">Nội dung lý thuyết (HTML Content)</label>
                        <textarea th:field="*{htmlContent}" rows="8" placeholder="<p>Nhập nội dung bài học...</p>" style="width: 100%; padding: 0.65rem; border: 1px solid var(--border-color); border-radius: 0.375rem; font-family: monospace;"></textarea>
                    </div>
                </div>

                <!-- KHU VỰC CONDITIONAL 2: DÀNH CHO BÀI QUIZ (QUIZ) -->
                <div id="section-quiz" style="margin-bottom: 1.25rem; display: none;">
                    <label style="display: block; font-weight: 600; margin-bottom: 0.35rem; font-size: 0.9rem;">Chọn bài Quiz đã tạo *</label>
                    <select name="quizId" style="width: 100%; padding: 0.65rem; border: 1px solid var(--border-color); border-radius: 0.375rem; background: #ffffff;">
                        <option value="">-- Chọn bài Quiz để gắn vào bài học --</option>
                        <option th:each="q : ${quizzes}" th:value="${q.id}" th:text="${q.name + ' (' + q.duration + ' phút, ' + q.passRate + '%)'}" th:selected="${lesson.quiz != null && lesson.quiz.id == q.id}"></option>
                    </select>
                    <small style="color: var(--text-muted); display: block; margin-top: 0.3rem;">
                        Chưa có Quiz? Bạn có thể tạo tại menu <a th:href="@{/content/quizzes/new}" target="_blank" style="color: var(--primary-color);">Quản lý Quiz & Test</a>.
                    </small>
                </div>

                <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                    <button type="submit" class="btn btn-primary" style="padding: 0.65rem 1.5rem;">💾 Lưu bài học</button>
                    <a th:href="@{'/content/subjects/' + ${subject.id} + '/lessons'}" class="btn btn-outline" style="padding: 0.65rem 1.5rem;">Hủy</a>
                </div>
            </form>
        </div>

        <!-- SCRIPT XỬ LÝ CONDITIONAL UI THEO TYPE -->
        <script th:inline="javascript">
            function toggleLessonType(type) {
                const lessonSec = document.getElementById('section-lesson');
                const quizSec = document.getElementById('section-quiz');

                if (type === 'SUBJECT_TOPIC') {
                    lessonSec.style.display = 'none';
                    quizSec.style.display = 'none';
                } else if (type === 'LESSON') {
                    lessonSec.style.display = 'block';
                    quizSec.style.display = 'none';
                } else if (type === 'QUIZ') {
                    lessonSec.style.display = 'none';
                    quizSec.style.display = 'block';
                }
            }

            // Kích hoạt trạng thái ban đầu dựa vào radio đang checked
            document.addEventListener('DOMContentLoaded', function() {
                const checkedRadio = document.querySelector('input[name="type"]:checked');
                if (checkedRadio) {
                    toggleLessonType(checkedRadio.value);
                }
            });
        </script>
    </div>
</body>
</html>
