<!-- Thư mục: src/main/resources/templates/content/lesson-details.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: base-layout(~{::title}, ~{::#content-body})}">
<head>
    <title th:text="${lessonForm.id != null ? 'Chỉnh sửa bài học: ' + lessonForm.name : 'Thêm bài học mới'}">Chi tiết bài học</title>
</head>
<body>
    <div id="content-body">
        <div class="mb-4">
            <a th:href="@{'/content/subjects/' + ${subject.id} + '/lessons'}" class="text-decoration-none text-muted small">
                ← Quay lại danh sách bài học môn: <span th:text="${subject.name}">Java Core</span>
            </a>
            <h1 class="h3 fw-bold mt-1 mb-0"
                th:text="${lessonForm.id != null ? '✏️ Chỉnh sửa bài học: ' + lessonForm.name : '➕ Thêm bài học mới'}">
                Thêm bài học mới
            </h1>
        </div>

        <div class="card shadow-sm border-0" style="max-width: 850px;">
            <div class="card-body p-4">
                <form th:action="${lessonForm.id != null ? '/content/lessons/' + lessonForm.id : '/content/lessons/new'}"
                      th:object="${lessonForm}" method="post" id="lesson-form">
                    <input type="hidden" th:field="*{id}">
                    <input type="hidden" th:field="*{subjectId}">

                    <!-- Subject Info Header -->
                    <div class="p-3 bg-light rounded border mb-4 d-flex justify-content-between align-items-center">
                        <div>
                            <span class="text-muted small">Môn học đang thao tác:</span>
                            <div class="fw-bold" th:text="${subject.name}">Java Core cơ bản</div>
                        </div>
                        <span class="badge bg-secondary" th:text="${subject.category != null ? subject.category.name : ''}">Lập trình</span>
                    </div>

                    <!-- Phân loại Type (Conditional Selector) -->
                    <div class="mb-4 p-3 bg-light rounded border">
                        <label class="form-label fw-bold mb-2">Phân loại bài học (Lesson Type) *</label>
                        <div class="d-flex gap-4">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="type" id="typeTopic" value="SUBJECT_TOPIC"
                                       th:checked="${lessonForm.type?.name() == 'SUBJECT_TOPIC'}" onchange="toggleLessonType('SUBJECT_TOPIC')">
                                <label class="form-check-label fw-semibold" for="typeTopic">
                                    📁 Chương mục (Topic)
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="type" id="typeLesson" value="LESSON"
                                       th:checked="${lessonForm.type == null || lessonForm.type?.name() == 'LESSON'}" onchange="toggleLessonType('LESSON')">
                                <label class="form-check-label fw-semibold" for="typeLesson">
                                    📄 Bài giảng (Video/HTML)
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="type" id="typeQuiz" value="QUIZ"
                                       th:checked="${lessonForm.type?.name() == 'QUIZ'}" onchange="toggleLessonType('QUIZ')">
                                <label class="form-check-label fw-semibold" for="typeQuiz">
                                    📝 Bài kiểm tra (Quiz)
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- Tên bài học -->
                    <div class="mb-3">
                        <label for="lessonName" class="form-label fw-bold">Tên bài học / Tiêu đề chương *</label>
                        <input type="text" th:field="*{name}" id="lessonName" required placeholder="VD: Bài 1: Cài đặt môi trường JDK" class="form-control">
                    </div>

                    <!-- Thứ tự & Chương mục cha & Trạng thái -->
                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label for="lessonOrder" class="form-label fw-bold">Thứ tự hiển thị (Order) *</label>
                            <input type="number" th:field="*{orderNum}" id="lessonOrder" min="1" required class="form-control">
                        </div>

                        <div class="col-md-4">
                            <label for="lessonParent" class="form-label fw-bold">Chương mục cha (Topic)</label>
                            <select th:field="*{parentId}" id="lessonParent" class="form-select">
                                <option value="">-- Không có (Chương gốc) --</option>
                                <option th:each="pt : ${parentTopics}" th:value="${pt.id}" th:text="${pt.name}"></option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label for="lessonStatus" class="form-label fw-bold">Trạng thái (Status)</label>
                            <select th:field="*{status}" id="lessonStatus" class="form-select">
                                <option value="ACTIVE">Active</option>
                                <option value="INACTIVE">Inactive</option>
                            </select>
                        </div>
                    </div>

                    <!-- KHU VỰC CONDITIONAL 1: DÀNH CHO BÀI HỌC (LESSON) -->
                    <div id="section-lesson" class="mb-3 p-3 bg-white border rounded">
                        <h6 class="fw-bold text-primary mb-3">🎥 Chi tiết nội dung Bài giảng</h6>
                        
                        <div class="mb-3">
                            <label for="lessonVideo" class="form-label fw-semibold">Link Video bài giảng (YouTube/Vimeo)</label>
                            <input type="url" th:field="*{videoLink}" id="lessonVideo" placeholder="https://www.youtube.com/watch?v=..." class="form-control">
                        </div>

                        <div class="mb-2">
                            <label for="lessonHtml" class="form-label fw-semibold">Nội dung lý thuyết (HTML Content)</label>
                            <textarea th:field="*{htmlContent}" id="lessonHtml" rows="7" placeholder="<p>Nhập nội dung bài giảng tại đây...</p>" class="form-control font-monospace"></textarea>
                        </div>
                    </div>

                    <!-- KHU VỰC CONDITIONAL 2: DÀNH CHO BÀI QUIZ (QUIZ) -->
                    <div id="section-quiz" class="mb-3 p-3 bg-white border rounded" style="display: none;">
                        <h6 class="fw-bold text-warning mb-3">📝 Gắn bài Quiz trắc nghiệm</h6>
                        
                        <div class="mb-2">
                            <label for="quizSelect" class="form-label fw-semibold">Chọn bài Quiz từ môn học này *</label>
                            <select th:field="*{quizId}" id="quizSelect" class="form-select">
                                <option value="">-- Chọn bài Quiz để gắn vào bài học --</option>
                                <option th:each="q : ${quizzes}" th:value="${q.id}" th:text="${q.name + ' (' + q.duration + ' phút, ' + q.passRate + '%)'}"></option>
                            </select>
                            <div class="form-text mt-2">
                                Chưa có Quiz? Bạn có thể tạo tại menu <a th:href="@{/content/quizzes/new}" target="_blank" class="fw-bold text-primary">Tạo bài Quiz mới</a>.
                            </div>
                        </div>
                    </div>

                    <!-- Action buttons: Cancel left, Save right per Section 7.6 -->
                    <div class="d-flex justify-content-between align-items-center mt-4">
                        <a th:href="@{'/content/subjects/' + ${subject.id} + '/lessons'}" class="btn btn-outline-secondary px-4">← Quay lại / Hủy</a>
                        <button type="submit" class="btn btn-primary px-4" id="btn-save-lesson">💾 Lưu bài học</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- SCRIPT XỬ LÝ CONDITIONAL UI THEO TYPE (Vanilla JS) -->
        <script>
            function toggleLessonType(type) {
                const lessonSec = document.getElementById('section-lesson');
                const quizSec = document.getElementById('section-quiz');

                if (type === 'SUBJECT_TOPIC') {
                    lessonSec.style.display = 'none';
                    quizSec.style.display = 'none';
                } else if (type === 'LESSON') {
                    lessonSec.style.display = 'block';
                    quizSec.style.display = 'none';
                } else if (type === 'QUIZ') {
                    lessonSec.style.display = 'none';
                    quizSec.style.display = 'block';
                }
            }

            // Kích hoạt trạng thái ban đầu dựa vào radio đang checked
            document.addEventListener('DOMContentLoaded', function() {
                const checkedRadio = document.querySelector('input[name="type"]:checked');
                if (checkedRadio) {
                    toggleLessonType(checkedRadio.value);
                }
            });
        </script>
    </div>
</body>
</html>
