<!-- Thư mục: src/main/resources/templates/content/subject-new.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: base-layout(~{::title}, ~{::#content-body})}">
<head>
    <title>Thêm Khóa học mới - OnlineLearn</title>
</head>
<body>
    <div id="content-body">
        <div class="mb-4">
            <a th:href="@{/content/subjects}" class="text-decoration-none text-muted small">← Quay lại danh sách môn học</a>
            <h1 class="h3 fw-bold mt-1 mb-0">➕ Thêm Khóa học mới (Admin)</h1>
            <p class="text-muted small mb-0">Tạo khóa học mới và phân công Giảng viên / Chuyên gia (Expert) phụ trách nội dung</p>
        </div>

        <div class="card shadow-sm border-0" style="max-width: 850px;">
            <div class="card-body p-4">
                <form th:action="@{/content/subjects/new}" th:object="${subject}" method="post">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Tên môn học / Khóa học *</label>
                        <input type="text" th:field="*{name}" required placeholder="VD: Khóa học Lập trình Flutter" class="form-control">
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold small">Danh mục *</label>
                            <select name="categoryId" required class="form-select">
                                <option value="">-- Chọn danh mục --</option>
                                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold small">Gán Chuyên gia phụ trách (Owner / Expert) *</label>
                            <select name="ownerId" required class="form-select">
                                <option value="">-- Chọn Expert phụ trách --</option>
                                <option th:each="exp : ${experts}" th:value="${exp.id}" th:text="${exp.fullName + ' (' + exp.email + ')'}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold small">Ảnh đại diện (Thumbnail URL)</label>
                        <input type="url" th:field="*{thumbnail}" placeholder="https://picsum.photos/400/250" class="form-control">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold small">Thông tin tóm tắt (Brief Info)</label>
                        <input type="text" th:field="*{briefInfo}" placeholder="Tóm tắt ngắn gọn 1-2 câu về khóa học..." class="form-control">
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold small">Mô tả khóa học (Description)</label>
                        <textarea th:field="*{description}" rows="5" placeholder="Mục tiêu khóa học, nội dung chi tiết..." class="form-control"></textarea>
                    </div>

                    <div class="d-flex justify-content-between align-items-center">
                        <a th:href="@{/content/subjects}" class="btn btn-outline-secondary px-4">← Quay lại / Hủy</a>
                        <button type="submit" class="btn btn-primary px-4">➕ Tạo khóa học</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
