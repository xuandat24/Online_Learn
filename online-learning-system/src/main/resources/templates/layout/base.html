<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      th:fragment="base-layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">OnlineLearn - Hệ thống học trực tuyến</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/shared/css/global.css}">
    <style>
        :root {
            --sidebar-width: 260px;
        }
        body {
            background-color: #f8fafc;
            min-height: 100vh;
        }
        .app-wrapper {
            display: flex;
            min-height: calc(100vh - 70px);
        }
        .app-sidebar {
            width: var(--sidebar-width);
            background-color: #0f172a;
            color: #f8fafc;
            padding: 1.5rem 1rem;
            flex-shrink: 0;
        }
        .app-sidebar h6 {
            font-size: 0.8rem;
            margin-top: 1.25rem;
            margin-bottom: 0.75rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 700;
        }
        .sidebar-nav {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }
        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.65rem 0.85rem;
            color: #cbd5e1;
            text-decoration: none;
            border-radius: 0.375rem;
            font-size: 0.92rem;
            font-weight: 500;
            transition: all 0.2s;
        }
        .sidebar-nav a:hover, .sidebar-nav a.active {
            background-color: #1e293b;
            color: #ffffff;
        }
        .app-main {
            flex: 1;
            padding: 2rem;
            background-color: #f8fafc;
            overflow-x: auto;
        }
        .role-badge {
            display: inline-block;
            padding: 0.25rem 0.6rem;
            font-size: 0.75rem;
            font-weight: 700;
            border-radius: 0.375rem;
            color: #ffffff;
            margin-bottom: 1rem;
            letter-spacing: 0.03em;
        }
    </style>
</head>
<body>
    <!-- Site Header -->
    <div th:replace="~{fragments/header :: site-header}"></div>

    <div class="app-wrapper">
        <!-- Sidebar with sec:authorize -->
        <aside class="app-sidebar">
            <div sec:authorize="hasRole('ADMIN')" class="role-badge bg-danger">ADMINISTRATOR</div>
            <div sec:authorize="hasRole('EXPERT')" class="role-badge bg-primary">EXPERT / GIẢNG VIÊN</div>

            <h6>Quản lý Nội dung</h6>
            <ul class="sidebar-nav">
                <li><a th:href="@{/content/subjects}">📚 Danh sách Khóa học</a></li>
                <li sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/content/subjects/new}">➕ Thêm Khóa học mới</a>
                </li>
            </ul>

            <h6>Khảo Thí & Ngân Hàng</h6>
            <ul class="sidebar-nav">
                <li><a th:href="@{/content/questions}">❓ Ngân hàng Câu hỏi</a></li>
                <li><a th:href="@{/content/quizzes}">📝 Quản lý Quiz & Test</a></li>
            </ul>

            <h6>Điều hướng</h6>
            <ul class="sidebar-nav">
                <li sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/admin/dashboard}">⚙️ Về Admin Portal</a>
                </li>
                <li><a th:href="@{/}">🌐 Xem trang chủ</a></li>
            </ul>
        </aside>

        <!-- Main Body -->
        <main class="app-main">
            <div th:if="${content != null}" th:replace="${content}">
                <!-- Page content injected here -->
            </div>
            <div layout:fragment="content"></div>
        </main>
    </div>

    <!-- Site Footer -->
    <div th:replace="~{fragments/footer :: site-footer}"></div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
