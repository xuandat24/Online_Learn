<!-- Thư mục: src/main/resources/templates/user/dashboard.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/user-layout :: user-layout(~{::title}, ~{::#user-content})}">
<head>
    <title>Khóa học của tôi - OnlineLearn</title>
</head>
<body>
    <div id="user-content">
        <h1 style="font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem;">Khóa học của tôi</h1>
        <p style="color: var(--text-muted); margin-bottom: 2rem;">Tiếp tục lộ trình học tập và hoàn thành các mục tiêu của bạn</p>

        <!-- Trạng thái khi chưa đăng ký khóa nào -->
        <div th:if="${#lists.isEmpty(enrolledCourses)}" style="background: #ffffff; padding: 3rem; text-align: center; border-radius: 0.5rem; border: 1px solid var(--border-color);">
            <p style="color: var(--text-muted); margin-bottom: 1rem;">Bạn chưa đăng ký khóa học nào.</p>
            <a th:href="@{/courses}" class="btn btn-primary">Khám phá khóa học ngay</a>
        </div>

        <!-- Danh sách khóa học đã kích hoạt -->
        <div th:unless="${#lists.isEmpty(enrolledCourses)}" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem;">
            <div th:each="access : ${enrolledCourses}" class="course-card" style="background: #ffffff; border: 1px solid var(--border-color); border-radius: 0.5rem; overflow: hidden;">
                <img th:src="${access.subject.thumbnail != null ? access.subject.thumbnail : 'https://picsum.photos/400/250'}"
                     src="https://picsum.photos/400/250"
                     style="width: 100%; height: 160px; object-fit: cover;"
                     alt="Course Thumbnail">
                <div style="padding: 1.25rem;">
                    <h3 style="font-size: 1.15rem; font-weight: 700; margin-bottom: 0.5rem;" th:text="${access.subject.name}">Java Core cơ bản</h3>
                    <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem;">
                        Ngày kích hoạt: <span th:text="${#temporals.format(access.grantedDate, 'dd/MM/yyyy')}">01/01/2026</span>
                    </p>
                    <a th:href="@{'/learning/' + ${access.subject.id}}" class="btn btn-primary" style="width: 100%; text-align: center;">Vào học ngay</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
