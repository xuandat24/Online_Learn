<!-- Thư mục: src/main/resources/templates/common/error/403.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Không có quyền truy cập</title>
    <link rel="stylesheet" th:href="@{/shared/css/global.css}">
    <style>
        .error-container {
            text-align: center;
            padding: 5rem 1rem;
        }
        .error-code {
            font-size: 6rem;
            font-weight: 800;
            color: #ef4444;
            line-height: 1;
            margin-bottom: 1rem;
        }
        .error-title {
            font-size: 1.75rem;
            margin-bottom: 1rem;
        }
        .error-desc {
            color: var(--text-muted);
            max-width: 480px;
            margin: 0 auto 2rem auto;
        }
    </style>
</head>
<body>
    <div th:replace="~{fragments/header :: site-header}"></div>

    <main class="container error-container">
        <div class="error-code">403</div>
        <h1 class="error-title">Truy cập bị từ chối</h1>
        <p class="error-desc">Bạn không có quyền hạn để truy cập vào trang này. Vui lòng đăng nhập với tài khoản có quyền phù hợp hoặc quay về trang chủ.</p>
        <a th:href="@{/}" class="btn btn-primary">Về trang chủ</a>
    </main>

    <div th:replace="~{fragments/footer :: site-footer}"></div>
</body>
</html>
