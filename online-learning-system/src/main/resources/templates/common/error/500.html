<!-- Thư mục: src/main/resources/templates/common/error/500.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Lỗi máy chủ nội bộ</title>
    <link rel="stylesheet" th:href="@{/shared/css/global.css}">
    <style>
        .error-container {
            text-align: center;
            padding: 5rem 1rem;
        }
        .error-code {
            font-size: 6rem;
            font-weight: 800;
            color: #f59e0b;
            line-height: 1;
            margin-bottom: 1rem;
        }
        .error-title {
            font-size: 1.75rem;
            margin-bottom: 1rem;
        }
        .error-desc {
            color: var(--text-muted);
            max-width: 480px;
            margin: 0 auto 2rem auto;
        }
    </style>
</head>
<body>
    <div th:replace="~{fragments/header :: site-header}"></div>

    <main class="container error-container">
        <div class="error-code">500</div>
        <h1 class="error-title">Lỗi hệ thống</h1>
        <p class="error-desc">Đã có lỗi bất ngờ xảy ra trong quá trình xử lý yêu cầu. Đội ngũ kỹ thuật đang kiểm tra và khắc phục.</p>
        <a th:href="@{/}" class="btn btn-primary">Về trang chủ</a>
    </main>

    <div th:replace="~{fragments/footer :: site-footer}"></div>
</body>
</html>
