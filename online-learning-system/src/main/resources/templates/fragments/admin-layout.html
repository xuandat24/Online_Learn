<!-- Thư mục: src/main/resources/templates/fragments/admin-layout.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="admin-layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">Admin Dashboard - OnlineLearn</title>
    <!-- Shared & Admin-specific styles -->
    <link rel="stylesheet" th:href="@{/shared/css/global.css}">
    <style>
        .admin-wrapper {
            display: flex;
            min-height: calc(100vh - 120px);
        }
        .admin-sidebar {
            width: 250px;
            background-color: #1e293b;
            color: #f1f5f9;
            padding: 1.5rem 1rem;
        }
        .admin-sidebar h3 {
            font-size: 1.1rem;
            margin-bottom: 1.5rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .admin-menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .admin-menu a {
            display: block;
            padding: 0.75rem 1rem;
            color: #cbd5e1;
            text-decoration: none;
            border-radius: 0.375rem;
            transition: all 0.2s;
        }
        .admin-menu a:hover, .admin-menu a.active {
            background-color: #334155;
            color: #ffffff;
        }
        .admin-body {
            flex: 1;
            padding: 2rem;
            background-color: #f8fafc;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div th:replace="~{fragments/header :: site-header}"></div>

    <!-- Admin Layout Container -->
    <div class="admin-wrapper">
        <aside class="admin-sidebar">
            <h3>Admin Portal</h3>
            <ul class="admin-menu">
                <li><a th:href="@{/admin/dashboard}">📊 Bảng điều khiển</a></li>
                <li><a th:href="@{/admin/users}">👥 Quản lý người dùng</a></li>
                <li><a th:href="@{/content/subjects}">📚 Quản lý Khóa học & Test</a></li>
                <li><a th:href="@{/admin/settings}">⚙️ Cài đặt hệ thống</a></li>
                <li><a th:href="@{/}">🌐 Xem trang học viên</a></li>
            </ul>
        </aside>
        
        <main class="admin-body">
            <div th:replace="${content}">
                <!-- Page-specific content injected here -->
            </div>
        </main>
    </div>

    <!-- Footer -->
    <div th:replace="~{fragments/footer :: site-footer}"></div>
</body>
</html>
