<!-- Thư mục: src/main/resources/templates/fragments/content-layout.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="content-layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:replace="${title}">Content Management - OnlineLearn</title>
    <link rel="stylesheet" th:href="@{/shared/css/global.css}">
    <style>
        .content-wrapper {
            display: flex;
            min-height: calc(100vh - 120px);
        }
        .content-sidebar {
            width: 250px;
            background-color: #0f172a;
            color: #f8fafc;
            padding: 1.5rem 1rem;
        }
        .content-sidebar h3 {
            font-size: 0.95rem;
            margin-bottom: 1.25rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .content-menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }
        .content-menu a {
            display: block;
            padding: 0.7rem 0.9rem;
            color: #cbd5e1;
            text-decoration: none;
            border-radius: 0.375rem;
            font-size: 0.92rem;
            transition: all 0.2s;
        }
        .content-menu a:hover {
            background-color: #1e293b;
            color: #ffffff;
        }
        .content-body {
            flex: 1;
            padding: 2rem;
            background-color: #f8fafc;
        }
        .role-tag {
            display: inline-block;
            padding: 0.2rem 0.5rem;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 0.25rem;
            background-color: #3b82f6;
            color: #ffffff;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <!-- Site Header -->
    <div th:replace="~{fragments/header :: site-header}"></div>

    <!-- Content Workspace Layout -->
    <div class="content-wrapper">
        <aside class="content-sidebar">
            <div sec:authorize="hasRole('ADMIN')" class="role-tag" style="background-color: #dc2626;">ADMIN MODE</div>
            <div sec:authorize="hasRole('EXPERT')" class="role-tag" style="background-color: #0284c7;">EXPERT MODE</div>
            
            <h3>Nội Dung Khóa Học</h3>
            <ul class="content-menu">
                <li><a th:href="@{/content/subjects}">📚 Danh sách Khóa học</a></li>
                <li sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/content/subjects/new}">➕ Thêm Khóa học mới</a>
                </li>
            </ul>

            <h3 style="margin-top: 1.5rem;">Khảo Thí & Đánh Giá</h3>
            <ul class="content-menu">
                <li><a th:href="@{/content/questions}">❓ Ngân hàng Câu hỏi</a></li>
                <li><a th:href="@{/content/quizzes}">📝 Quản lý Quiz & Test</a></li>
            </ul>

            <h3 style="margin-top: 1.5rem;">Hệ Thống</h3>
            <ul class="content-menu">
                <li sec:authorize="hasRole('ADMIN')"><a th:href="@{/admin/dashboard}">⚙️ Về Admin Portal</a></li>
                <li><a th:href="@{/}">🌐 Xem trang chủ</a></li>
            </ul>
        </aside>

        <main class="content-body">
            <div th:replace="${content}">
                <!-- Page-specific content goes here -->
            </div>
        </main>
    </div>

    <!-- Site Footer -->
    <div th:replace="~{fragments/footer :: site-footer}"></div>
</body>
</html>
