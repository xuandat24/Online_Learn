server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8801}
  error:
    include-message: never
spring:
  profiles:
    default: local
  application:
    name: onlinelearn
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:14333;databaseName=OnlineLearnDB;encrypt=true;trustServerCertificate=true;integratedSecurity=true;ipAddressPreference=IPv6First}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME:}
    password: ${GMAIL_APP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  jackson:
    time-zone: UTC
management:
  health:
    mail:
      enabled: ${SMTP_HEALTH_CHECK:false}
  endpoints:
    web:
      exposure:
        include: health
app:
  public-backend-url: ${PUBLIC_BACKEND_URL:http://127.0.0.1:8801}
  sepay:
    merchant-id: ${SEPAY_MERCHANT_ID:}
    secret-key: ${SEPAY_SECRET_KEY:}
    ipn-secret-key: ${SEPAY_IPN_SECRET_KEY:}
    checkout-url: ${SEPAY_CHECKOUT_URL:https://pay-sandbox.sepay.vn/v1/checkout/init}
    api-url: ${SEPAY_API_URL:https://pgapi-sandbox.sepay.vn}
    ipn-max-age-seconds: ${SEPAY_IPN_MAX_AGE_SECONDS:86400}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  jwt-secret: ${JWT_SECRET}
  token-minutes: 120
  verify-hours: 24
  reset-minutes: 30
  demo-seed: ${DEMO_SEED:false}
  demo-password: ${DEMO_PASSWORD:}
  mail-mode: ${MAIL_MODE:smtp}
  mail-directory: ${MAIL_DIRECTORY:../.runtime/mail}
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
    payment-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
    query-url: https://sandbox.vnpayment.vn/merchant_webapi/api/transaction
    return-url: ${VNPAY_RETURN_URL:http://localhost:5173/payment/return}
